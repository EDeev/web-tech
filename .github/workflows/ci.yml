name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Синтаксис всех скриптов
        run: find labs tasks -name "*.js" -print0 | xargs -0 -n1 node --check
